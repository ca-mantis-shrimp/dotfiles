# Our own repos, cloned where agents and skills expect them. chezmoi clones on
# the first apply and never pulls on later ones (a working checkout is left
# alone); `chezmoi apply --refresh-externals` fast-forwards.
["Products/platform"]
    type = "git-repo"
    url = "https://github.com/ClearHeadToDo-Devs/platform.git"
    clone.args = ["--recurse-submodules"]

# Release binaries, pinned by version and checksum. Bump both together.
# All are linux/amd64 builds; elsewhere (the phone's Termux) they can't run, so
# they stay off and .chezmoiremove clears copies installed before this guard.
{{ if and (eq .chezmoi.os "linux") (eq .chezmoi.arch "amd64") -}}
[".local/bin/okf"]
    type = "archive-file"
    url = "https://github.com/okfcli/okf/releases/download/v0.5.0/okf_0.5.0_linux_amd64.tar.gz"
    path = "okf"
    executable = true
    checksum.sha256 = "287b666f13cfb1507fddacc7202dce81de722ec1ffde81845b8ac3f16626d531"

# 1Password CLI: the facilitator reads SRR's deploy secrets through a scoped service account.
# Checksum from the first download, whose op.sig verified against 1Password's signing key
# 3FEF9748469ADBE15DA7CA80AC2D62742012EA22.
[".local/bin/op"]
    type = "archive-file"
    url = "https://cache.agilebits.com/dist/1P/op2/pkg/v2.41.0/op_linux_amd64_v2.41.0.zip"
    path = "op"
    executable = true
    checksum.sha256 = "498bbaa154f0d90749325a14e04488fcd84930a426ae92ebf421d2a7d793a80a"

# Stripe CLI: local webhook forwarding and test events for srr. Checksum from upstream's checksums file.
[".local/bin/stripe"]
    type = "archive-file"
    url = "https://github.com/stripe/stripe-cli/releases/download/v1.54.1/stripe_1.54.1_linux_x86_64.tar.gz"
    path = "stripe"
    executable = true
    checksum.sha256 = "59ac00af3ca11a02f76232642d6d534c5c0e9e433889b86006f5046d33baf657"

# Copilot's LSP: inline completion and sidekick's next edit suggestions in nvim.
# Upstream publishes no checksums; this one is from the first download.
[".local/bin/copilot-language-server"]
    type = "archive-file"
    url = "https://github.com/github/copilot-language-server-release/releases/download/1.554.0/copilot-language-server-linux-x64-1.554.0.zip"
    path = "copilot-language-server"
    executable = true
    checksum.sha256 = "f87d67b12986bfb8106cd19fef79b80a423bc1012975c8f380bcd164a753b541"

# Clojure toolchain, for rwd. The JDK is the runtime; the rest are native builds.
[".local/lib/jdk"]
    type = "archive"
    url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz"
    stripComponents = 1
    exact = true
    checksum.sha256 = "dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e"

[".local/bin/clojure-lsp"]
    type = "archive-file"
    url = "https://github.com/clojure-lsp/clojure-lsp/releases/download/2026.10.15-11.42.38/clojure-lsp-native-static-linux-amd64.zip"
    path = "clojure-lsp"
    executable = true
    checksum.sha256 = "81fa5cc4aeef09fd14e94b9913d3e46a47c32f39096d60c49b27f3609912c44a"

[".local/bin/clj-kondo"]
    type = "archive-file"
    url = "https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-static-amd64.zip"
    path = "clj-kondo"
    executable = true
    checksum.sha256 = "25dce55f597cc7f034f6c5f8bf4195128e3efeb3b22710a066fb67b489e70a3b"

[".local/bin/cljfmt"]
    type = "archive-file"
    url = "https://github.com/weavejester/cljfmt/releases/download/0.16.6/cljfmt-0.16.6-linux-amd64-static.tar.gz"
    path = "cljfmt"
