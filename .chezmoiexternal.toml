# nvim-treesitter (main) compiles parsers with the tree-sitter CLI; it must not come from npm.
[".local/bin/tree-sitter"]
    type = "file"
    url = "https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.1/tree-sitter-linux-x64.gz"
    decompress = "gzip"
    executable = true
    checksum.sha256 = "d01042f94ba3d6827ddc9788e235f75d8366431be42bdf90ade534d960c98b7d"
{{ end -}}
